<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1132" viewBox="0 0 1440 1132"><rect width="1440" height="1132" fill="#fafafa"/><rect x="24" y="24" width="684" height="254" rx="16" fill="#FFDF48"/><text x="52" y="68" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#171717">1. Точки входа</text><text x="52" y="112" font-family="Arial,sans-serif" font-size="23" fill="#242424">Баннеры на главной и в разделах выгоды,</text><text x="52" y="143" font-family="Arial,sans-serif" font-size="23" fill="#242424">слайдер сервисов, блок карт, личные</text><text x="52" y="174" font-family="Arial,sans-serif" font-size="23" fill="#242424">кабинеты и промосайты.</text><rect x="732" y="24" width="684" height="254" rx="16" fill="#FFDF48"/><text x="760" y="68" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#171717">2. Прошедшие акции</text><text x="760" y="112" font-family="Arial,sans-serif" font-size="23" fill="#242424">Архив показывает пропущенные предложения.</text><text x="760" y="143" font-family="Arial,sans-serif" font-size="23" fill="#242424">Возможное влияние FOMO на возвращение —</text><text x="760" y="174" font-family="Arial,sans-serif" font-size="23" fill="#242424">гипотеза.</text><rect x="24" y="302" width="684" height="254" rx="16" fill="#FFDF48"/><text x="52" y="346" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#171717">3. Пошаговая инструкция</text><text x="52" y="390" font-family="Arial,sans-serif" font-size="23" fill="#242424">Линейная последовательность объясняет</text><text x="52" y="421" font-family="Arial,sans-serif" font-size="23" fill="#242424">участие. Понятность для разных возрастов</text><text x="52" y="452" font-family="Arial,sans-serif" font-size="23" fill="#242424">нужно проверить.</text><rect x="732" y="302" width="684" height="254" rx="16" fill="#FFDF48"/><text x="760" y="346" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#171717">4. Отклик на достижения</text><text x="760" y="390" font-family="Arial,sans-serif" font-size="23" fill="#242424">Интерфейс эмоционально поддерживает</text><text x="760" y="421" font-family="Arial,sans-serif" font-size="23" fill="#242424">достижения. Влияние на мотивацию продолжать</text><text x="760" y="452" font-family="Arial,sans-serif" font-size="23" fill="#242424">— гипотеза.</text><rect x="24" y="580" width="684" height="254" rx="16" fill="#FFDF48"/><text x="52" y="624" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#171717">5. Совместные задания</text><text x="52" y="668" font-family="Arial,sans-serif" font-size="23" fill="#242424">Коллаборации связывают привычную игру с</text><text x="52" y="699" font-family="Arial,sans-serif" font-size="23" fill="#242424">предложением партнёра. Пример — «5 букв» и</text><text x="52" y="730" font-family="Arial,sans-serif" font-size="23" fill="#242424">«Пятёрочка».</text><rect x="732" y="580" width="684" height="254" rx="16" fill="#FFDF48"/><text x="760" y="624" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#171717">6. Задания и награды</text><text x="760" y="668" font-family="Arial,sans-serif" font-size="23" fill="#242424">В разобранных экранах встречается</text><text x="760" y="699" font-family="Arial,sans-serif" font-size="23" fill="#242424">разделение заданий и наград. В одном</text><text x="760" y="730" font-family="Arial,sans-serif" font-size="23" fill="#242424">примере сначала показан приз, затем</text><text x="760" y="761" font-family="Arial,sans-serif" font-size="23" fill="#242424">события.</text><rect x="24" y="858" width="684" height="254" rx="16" fill="#FFDF48"/><text x="52" y="902" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#171717">7. MCC-исключения</text><text x="52" y="946" font-family="Arial,sans-serif" font-size="23" fill="#242424">В рассмотренном примере термин не</text><text x="52" y="977" font-family="Arial,sans-serif" font-size="23" fill="#242424">объясняется на экране: подробности доступны</text><text x="52" y="1008" font-family="Arial,sans-serif" font-size="23" fill="#242424">по ссылке.</text></svg>